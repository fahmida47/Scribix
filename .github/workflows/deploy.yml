name: Deploy Scribix

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # 3. Install dependencies
      - name: Install dependencies
        working-directory: backend
        run: npm ci

      # 4. Build backend
      - name: Build backend
        working-directory: backend
        run: npm run build

      # 5. Setup SSH agent
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      # 6. Check GitHub Secrets
      - name: Check VPS configuration
        run: |
          echo "VPS_USER is set: ${{ secrets.VPS_USER != '' }}"
          echo "VPS_HOST is set: ${{ secrets.VPS_HOST != '' }}"
          echo "SSH key is set: ${{ secrets.VPS_SSH_KEY != '' }}"

      # 7. Test SSH connection
      - name: Test SSH connection
        run: |
          ssh -o StrictHostKeyChecking=no \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "whoami && pwd"

      # 8. Upload build using SCP
      - name: Upload build with SCP
        run: |
          scp -o StrictHostKeyChecking=no -r \
            backend/dist \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/home/${{ secrets.VPS_USER }}/Scribix/backend/"

      # 9. Restart application
      - name: Restart application
        run: |
          ssh -o StrictHostKeyChecking=no \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "cd ~/Scribix/backend && pm2 restart scribix && pm2 save"

      # 10. Verify deployment
      - name: Verify deployment
        run: |
          sleep 5
          curl -f "http://${{ secrets.VPS_HOST }}/api/health"
